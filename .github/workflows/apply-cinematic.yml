name: Apply cinematic portfolio background

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch hero and clean image path
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Add a preload for the cinematic portrait.
          if 'reezbhan-cinematic.jpg' not in s:
              s = s.replace(
                  '<link rel="preconnect" href="https://fonts.googleapis.com">',
                  '<link rel="preload" as="image" href="reezbhan-cinematic.jpg" fetchpriority="high">\n<link rel="preconnect" href="https://fonts.googleapis.com">',
                  1
              )

          old = re.compile(
              r'\.hero\{position:relative;min-height:100svh;display:flex;align-items:flex-end;padding-top:7rem;overflow:hidden;\}\n'
              r'#net\{position:absolute;inset:0;width:100%;height:100%;z-index:0;opacity:\.9;\}\n'
              r'@media \(max-width:760px\)\{#net\{opacity:\.45;\}\}\n'
              r'\.hero-glow\{.*?\}\n'
              r'\.hero-in\{position:relative;z-index:2;width:100%;\}',
              re.S
          )

          new = '''.hero{
            position:relative;
            min-height:100svh;
            display:flex;
            align-items:flex-end;
            padding-top:7rem;
            overflow:hidden;
            isolation:isolate;
          }
          .hero::before{
            content:"";
            position:absolute;
            z-index:0;
            top:0;
            right:0;
            bottom:0;
            width:min(72vw,900px);
            background-image:
              linear-gradient(90deg,var(--void) 0%,rgba(7,10,18,.94) 16%,rgba(7,10,18,.60) 48%,rgba(7,10,18,.18) 78%,rgba(7,10,18,.05) 100%),
              linear-gradient(180deg,rgba(7,10,18,.10) 0%,rgba(7,10,18,.04) 48%,rgba(7,10,18,.72) 100%),
              url("reezbhan-cinematic.jpg");
            background-size:cover;
            background-position:center top;
            background-repeat:no-repeat;
            opacity:.72;
            filter:saturate(.82) contrast(1.05);
            -webkit-mask-image:linear-gradient(90deg,transparent 0%,black 18%,black 100%);
            mask-image:linear-gradient(90deg,transparent 0%,black 18%,black 100%);
            pointer-events:none;
          }
          .hero::after{
            content:"";
            position:absolute;
            z-index:0;
            inset:0;
            background:radial-gradient(circle at 72% 24%,rgba(91,225,198,.07),transparent 30%),linear-gradient(180deg,rgba(7,10,18,.02),rgba(7,10,18,.28) 58%,var(--void) 100%);
            pointer-events:none;
          }
          #net{position:absolute;inset:0;width:100%;height:100%;z-index:1;opacity:.55;pointer-events:none;}
          .hero-glow{position:absolute;z-index:1;width:min(70vw,760px);aspect-ratio:1;right:-12%;top:2%;background:radial-gradient(circle,rgba(124,108,240,.14),rgba(91,225,198,.07) 42%,transparent 68%);filter:blur(28px);pointer-events:none;}
          .hero-in{position:relative;z-index:2;width:100%;}'''

          if not old.search(s):
              raise SystemExit('Could not find the original hero CSS block; no changes made.')
          s = old.sub(new, s, count=1)

          mobile = '''
          @media (max-width:760px){
            #net{opacity:.25;}
            .hero::before{
              width:100%;
              opacity:.34;
              background-image:
                linear-gradient(90deg,rgba(7,10,18,.96) 0%,rgba(7,10,18,.78) 42%,rgba(7,10,18,.34) 100%),
                linear-gradient(180deg,rgba(7,10,18,.10),rgba(7,10,18,.58) 72%,var(--void) 100%),
                url("reezbhan-cinematic.jpg");
              background-position:72% top;
              -webkit-mask-image:none;
              mask-image:none;
            }
          }
          '''
          if '@media (max-width:760px){' not in s[s.find('.hero-in'):s.find('.hero-in')+1000]:
              s = s.replace('.hero-in{position:relative;z-index:2;width:100%;}', '.hero-in{position:relative;z-index:2;width:100%;}\n'+mobile, 1)

          p.write_text(s, encoding='utf-8')

          # Remove the accidental empty nested image path; keep the real root image.
          bad = Path('assets/assets/reezbhan-cinematic.jpg')
          if bad.exists():
              bad.unlink()
          nested = Path('assets/assets')
          if nested.exists():
              try: nested.rmdir()
              except OSError: pass

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets .github/workflows/apply-cinematic.yml
          git rm -f .github/workflows/apply-cinematic.yml
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Add cinematic hero background"
          git push
